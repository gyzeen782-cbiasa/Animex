<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AnimeKu — Nonton Anime Sub Indo</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Page-specific inline refinements */
    .hero { animation: fadeIn 0.6s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .section { animation: slideUp 0.5s ease both; }
    .section:nth-child(2) { animation-delay: 0.1s; }
    .section:nth-child(3) { animation-delay: 0.2s; }
    .section:nth-child(4) { animation-delay: 0.3s; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .mobile-search {
      display: none;
      padding: 12px 16px 0;
    }

    .mobile-search input {
      width: 100%;
      padding: 11px 16px 11px 42px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
    }

    .mobile-search input::placeholder { color: var(--text-muted); }
    .mobile-search { position: relative; }
    .mobile-search .search-icon {
      position: absolute;
      left: 30px;
      top: 50%;
      transform: translateY(-30%);
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .mobile-search { display: block; }
    }
  </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar">
  <a href="index.html" class="navbar-logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#7c5cfc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Anime<span>Ku</span>
  </a>

  <div class="navbar-search">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" placeholder="Cari anime..." id="searchInput" autocomplete="off" />
  </div>

  <div class="navbar-actions">
    <a href="login.html" class="btn-login">Masuk</a>
  </div>
</nav>

<!-- Search overlay -->
<div class="search-overlay" id="searchOverlay"></div>

<!-- ===== PAGE ===== -->
<div class="page-wrapper">

  <!-- Mobile search bar -->
  <div class="mobile-search">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" placeholder="Cari anime..." id="mobileSearchInput" autocomplete="off" />
  </div>

  <!-- ===== HERO ===== -->
  <div class="hero" id="heroSection">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-gradient"></div>
    <div class="hero-content" id="heroContent">
      <div class="hero-badge">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#7c5cfc"><circle cx="12" cy="12" r="10"/></svg>
        On Going
      </div>
      <h1 class="hero-title" id="heroTitle">Memuat...</h1>
      <div class="hero-meta" id="heroMeta"></div>
      <p class="hero-desc" id="heroDesc">Memuat sinopsis...</p>
      <div class="hero-buttons">
        <a href="#" class="btn-primary" id="heroWatchBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Nonton Sekarang
        </a>
        <a href="#" class="btn-secondary" id="heroDetailBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          Detail
        </a>
      </div>
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </div>

  <!-- ===== ONGOING ANIME ===== -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">On Going</div>
      <a href="ongoing.html" class="section-link">
        Lihat Semua
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </a>
    </div>
    <div class="anime-grid" id="ongoingGrid">
      <!-- Skeleton -->
      <div class="skeleton-card"><div class="skeleton skeleton-thumb"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-sm"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-thumb"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-sm"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-thumb"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-sm"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-thumb"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-sm"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-thumb"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-sm"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-thumb"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-sm"></div></div>
    </div>
  </div>

  <!-- ===== JADWAL HARI INI ===== -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">Jadwal Hari Ini</div>
      <a href="jadwal.html" class="section-link">
        Semua Jadwal
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </a>
    </div>
    <div class="ongoing-grid" id="scheduleGrid">
      <div style="color:var(--text-muted); font-size:13px; grid-column: 1/-1; padding: 12px 0;">Memuat jadwal...</div>
    </div>
  </div>

  <!-- ===== COMPLETE ANIME ===== -->
  <div class="section" style="margin-top: 8px;">
    <div class="section-header">
      <div class="section-title">Anime Selesai</div>
      <a href="complete.html" class="section-link">
        Lihat Semua
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </a>
    </div>
    <div class="anime-grid" id="completeGrid">
      <div class="skeleton-card"><div class="skeleton skeleton-thumb"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-sm"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-thumb"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-sm"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-thumb"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-sm"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-thumb"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-sm"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-thumb"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-sm"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-thumb"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text-sm"></div></div>
    </div>
  </div>

  <div style="height: 32px;"></div>
</div>

<!-- ===== BOTTOM NAV ===== -->
<nav class="bottom-nav">
  <div class="bottom-nav-items">
    <a href="index.html" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </a>
    <a href="jadwal.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Jadwal
    </a>
    <a href="history.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      Riwayat
    </a>
    <a href="saved.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      Simpan
    </a>
    <a href="profile.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profil
    </a>
  </div>
</nav>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script src="js/main.js"></script>
<script src="js/home.js"></script>
</body>
</html>
