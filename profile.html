<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Akun — KitsuneID</title>
  <link rel="stylesheet" href="css/style.css"/>
  <!-- Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* LOGIN ANIMATIONS */
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(124,92,252,.4)}70%{box-shadow:0 0 0 12px rgba(124,92,252,0)}}
    @keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

    .login-wrap{padding:20px 0;animation:fadeUp .5s ease}
    .login-hero{text-align:center;padding:20px 0 28px;animation:fadeUp .4s ease}
    .login-fox{font-size:56px;animation:float 3s ease-in-out infinite;display:block;margin-bottom:12px}
    .login-title{font-size:24px;font-weight:800;margin-bottom:6px}
    .login-sub{font-size:13px;color:var(--text2);line-height:1.5}

    .login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;animation:fadeUp .5s .1s ease both}

    /* Method tabs */
    .method-tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:20px}
    .method-tab{flex:1;padding:9px;text-align:center;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);border:none;background:none;transition:all .2s}
    .method-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}

    /* Google btn */
    .btn-google{width:100%;padding:13px;background:#fff;border:none;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:700;color:#1f1f1f;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.15)}
    .btn-google:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
    .btn-google:active{transform:scale(.97)}
    .btn-google svg{width:20px;height:20px;flex-shrink:0}

    .or-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--text2);font-size:12px}
    .or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border)}

    /* Input */
    .inp-group{margin-bottom:14px}
    .inp-group label{display:block;font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
    .inp-group input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;font-family:inherit}
    .inp-group input:focus{border-color:var(--accent)}

    .btn-submit{width:100%;padding:13px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;transition:all .2s;animation:pulse 2s infinite;font-family:inherit}
    .btn-submit:hover{background:var(--accent2);animation:none;transform:translateY(-1px)}
    .btn-submit:disabled{opacity:.6;cursor:not-allowed;animation:none}

    .privacy-note{font-size:11px;color:var(--text2);text-align:center;margin-top:12px;line-height:1.6}

    /* Features preview */
    .features{display:flex;flex-direction:column;gap:10px;margin-top:20px;animation:fadeUp .5s .2s ease both}
    .feat-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:12px;border:1px solid var(--border);animation:slideIn .4s ease both}
    .feat-item:nth-child(1){animation-delay:.1s}
    .feat-item:nth-child(2){animation-delay:.2s}
    .feat-item:nth-child(3){animation-delay:.3s}
    .feat-icon{font-size:22px;flex-shrink:0}
    .feat-text{font-size:13px;font-weight:600}
    .feat-sub{font-size:11px;color:var(--text2);margin-top:1px}

    /* Logged in */
    .profile-wrap{animation:fadeUp .4s ease}
    .profile-hero{background:var(--card);border-radius:20px;padding:24px;text-align:center;margin-bottom:16px;border:1px solid var(--border)}
    .profile-avatar-wrap{position:relative;display:inline-block;margin-bottom:12px}
    .profile-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#5b3fd4);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;margin:0 auto}
    .profile-avatar img{width:72px;height:72px;border-radius:50%;object-fit:cover}
    .profile-badge{position:absolute;bottom:0;right:0;background:var(--success,#22c55e);border-radius:50%;width:18px;height:18px;border:2px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:9px}
    .profile-name{font-size:18px;font-weight:800;margin-bottom:2px}
    .profile-email{font-size:12px;color:var(--text2);margin-bottom:16px}
    .profile-method{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;background:rgba(124,92,252,.1);border-radius:20px;font-size:11px;color:var(--accent);font-weight:600;margin-bottom:16px}
    .profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .stat-box{background:var(--bg);border-radius:12px;padding:12px 8px;text-align:center}
    .stat-num{font-size:20px;font-weight:800;color:var(--accent)}
    .stat-lbl{font-size:10px;color:var(--text2);margin-top:2px}
    .menu-list{display:flex;flex-direction:column;gap:6px}
    .menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:all .2s}
    .menu-item:hover{border-color:var(--accent)}
    .menu-icon{width:34px;height:34px;border-radius:10px;background:rgba(124,92,252,.1);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
    .menu-label{flex:1;font-size:14px;font-weight:600}
    .menu-danger .menu-icon{background:rgba(239,68,68,.1);color:#ef4444}
    .menu-danger .menu-label{color:#ef4444}
  </style>
</head>
<body>
<nav class="navbar"><a href="index.html" class="logo"></a></nav>
<div class="page mobile-page">
  <div id="pageContent"></div>
  <div style="height:24px"></div>
</div>
<nav class="bnav"><div class="bnav-items">
  <a href="index.html" class="bnav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/></svg><span>Home</span></a>
  <a href="jadwal.html" class="bnav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Jadwal</span></a>
  <a href="random.html" class="bnav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg><span>Random</span></a>
  <a href="history.html" class="bnav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Riwayat</span></a>
  <a href="saved.html" class="bnav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span>Simpan</span></a>
  <a href="profile.html" class="bnav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Akun</span></a>
</div></nav>
<div class="toasts" id="toasts"></div>
<script src="js/main.js"></script>
<script>
// ── Config Telegram (opsional) ────────────────
const TG_BOT_TOKEN = '8783054628:AAGJjiJ0JqkLrLb_JmFOO6dVREaEu3A3kWQ'; // Isi token bot Telegram kamu
const TG_CHAT_ID   = '6834993952'; // Isi chat ID kamu

// ── Google Client ID ──────────────────────────
const GOOGLE_CLIENT_ID = '862848723735-7otojniiea5ncq47e6k6dnjjh619pogn.apps.googleusercontent.com'; // Isi Google Client ID kamu (dari Google Cloud Console)

let activeMethod = 'email'; // 'email' atau 'google'
let loginLock = false;

// ── Kirim notif ke Telegram ───────────────────
async function sendToTelegram(user, method) {
  if (!TG_BOT_TOKEN || !TG_CHAT_ID) return;
  try {
    const msg = `🦊 *Login Baru — KitsuneID*\n\n👤 *Nama:* ${user.name}\n📧 *Email:* ${user.email}\n🔑 *Via:* ${method}\n🕐 *Waktu:* ${new Date().toLocaleString('id-ID')}`;
    await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: TG_CHAT_ID, text: msg, parse_mode: 'Markdown' })
    });
  } catch(e) {}
}

// ── Google Login Handler ──────────────────────
function handleGoogleCredential(response) {
  try {
    // Decode JWT token dari Google
    const payload = JSON.parse(atob(response.credential.split('.')[1]));
    const user = {
      name: payload.name || payload.given_name || 'Pengguna Google',
      email: payload.email || '',
      avatar: payload.picture || '',
      method: 'google',
      loginAt: Date.now()
    };
    finishLogin(user, 'Google');
  } catch(e) {
    showToast('Login Google gagal', 'error');
  }
}

// ── Email Login ───────────────────────────────
function doEmailLogin() {
  if (loginLock) return;
  const name = document.getElementById('nameIn')?.value.trim();
  const email = document.getElementById('emailIn')?.value.trim();
  const pass = document.getElementById('passIn')?.value;
  if (!name || !email || !pass) {
    // Tidak spam toast — hanya highlight input kosong
    if (!name) document.getElementById('nameIn').style.borderColor = '#ef4444';
    if (!email) document.getElementById('emailIn').style.borderColor = '#ef4444';
    if (!pass) document.getElementById('passIn').style.borderColor = '#ef4444';
    showToast('Isi semua field!', 'error');
    return;
  }
  loginLock = true;
  const btn = document.getElementById('submitBtn');
  if (btn) { btn.textContent = 'Memuat...'; btn.disabled = true; }
  const user = { name, email, method: 'email', loginAt: Date.now() };
  finishLogin(user, 'Email');
}

// ── Selesaikan login ──────────────────────────
function finishLogin(user, method) {
  saveLocal('user', user);
  sendToTelegram(user, method);
  showToast(`Selamat datang, ${user.name}!`, 'success');
  setTimeout(() => { loginLock = false; renderPage(); }, 600);
}

// ── Switch tab method ─────────────────────────
function switchMethod(m) {
  activeMethod = m;
  document.querySelectorAll('.method-tab').forEach((b, i) =>
    b.classList.toggle('active', ['google','email'][i] === m));
  document.getElementById('googleSection').style.display = m === 'google' ? 'block' : 'none';
  document.getElementById('emailSection').style.display = m === 'email' ? 'block' : 'none';
}

// ── Render halaman ────────────────────────────
function renderPage() {
  const user = getLocal('user');
  const el = document.getElementById('pageContent');

  if (user) {
    // ── Sudah login ───
    const hist = getLocal('recentWatch') || [];
    const saved = getLocal('savedAnimes') || [];
    const wh = getLocal('watchHistory') || {};
    const totalEps = Object.values(wh).reduce((a, b) => a + b.length, 0);
    const initial = user.name ? user.name[0].toUpperCase() : 'K';
    const methodLabel = user.method === 'google' ? '🔵 Google' : '📧 Email';

    el.innerHTML = `
      <div class="page-hd anim"><h1>Akun Saya</h1></div>
      <div class="profile-wrap">
        <div class="profile-hero anim anim-d1">
          <div class="profile-avatar-wrap">
            ${user.avatar
              ? `<img src="${user.avatar}" class="profile-avatar" onerror="this.outerHTML='<div class=profile-avatar>${initial}</div>'">`
              : `<div class="profile-avatar">${initial}</div>`}
            <div class="profile-badge">✓</div>
          </div>
          <div class="profile-name">${user.name}</div>
          <div class="profile-email">${user.email}</div>
          <div class="profile-method">${methodLabel}</div>
          <div class="profile-stats">
            <div class="stat-box"><div class="stat-num">${hist.length}</div><div class="stat-lbl">Ditonton</div></div>
            <div class="stat-box"><div class="stat-num">${saved.length}</div><div class="stat-lbl">Disimpan</div></div>
            <div class="stat-box"><div class="stat-num">${totalEps}</div><div class="stat-lbl">Episode</div></div>
          </div>
        </div>
        <div class="menu-list anim anim-d2">
          <div class="menu-item" onclick="location.href='history.html'">
            <div class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
            <span class="menu-label">Riwayat Nonton</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
          <div class="menu-item" onclick="location.href='saved.html'">
            <div class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></div>
            <span class="menu-label">Anime Tersimpan</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
          <div class="menu-item menu-danger" onclick="doLogout()">
            <div class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></div>
            <span class="menu-label">Keluar</span>
          </div>
        </div>
      </div>`;
  } else {
    // ── Belum login ───
    const hasGoogleId = !!GOOGLE_CLIENT_ID;
    el.innerHTML = `
      <div class="login-wrap">
        <div class="login-hero">
          <span class="login-fox">🦊</span>
          <div class="login-title">Masuk ke KitsuneID</div>
          <div class="login-sub">Simpan riwayat & koleksi anime kamu</div>
        </div>

        <div class="login-box">
          ${hasGoogleId ? `
          <div class="method-tabs">
            <button class="method-tab" onclick="switchMethod('google')">🔵 Google</button>
            <button class="method-tab active" onclick="switchMethod('email')">📧 Email</button>
          </div>
          <div id="googleSection" style="display:none">
            <div id="g_id_onload"
              data-client_id="${GOOGLE_CLIENT_ID}"
              data-callback="handleGoogleCredential"
              data-auto_prompt="false">
            </div>
            <button class="btn-google" onclick="triggerGoogleLogin()">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              Lanjutkan dengan Google
            </button>
          </div>
          <div id="emailSection">` : '<div id="emailSection">'}

            <div class="inp-group">
              <label>Nama</label>
              <input type="text" id="nameIn" placeholder="Nama kamu"
                oninput="this.style.borderColor=''" onkeydown="if(event.key==='Enter')doEmailLogin()">
            </div>
            <div class="inp-group">
              <label>Email</label>
              <input type="email" id="emailIn" placeholder="email@contoh.com"
                oninput="this.style.borderColor=''" onkeydown="if(event.key==='Enter')doEmailLogin()">
            </div>
            <div class="inp-group">
              <label>Password</label>
              <input type="password" id="passIn" placeholder="Password kamu"
                oninput="this.style.borderColor=''" onkeydown="if(event.key==='Enter')doEmailLogin()">
            </div>
            <button class="btn-submit" id="submitBtn" onclick="doEmailLogin()">Masuk / Daftar</button>
            <p class="privacy-note">Data disimpan lokal di perangkat kamu</p>
          </div>
        </div>

        <div class="features">
          <div class="feat-item">
            <span class="feat-icon">📺</span>
            <div>
              <div class="feat-text">Riwayat Nonton</div>
              <div class="feat-sub">Lanjut nonton dari mana aja</div>
            </div>
          </div>
          <div class="feat-item">
            <span class="feat-icon">🔖</span>
            <div>
              <div class="feat-text">Simpan Anime</div>
              <div class="feat-sub">Buat watchlist pribadimu</div>
            </div>
          </div>
          <div class="feat-item">
            <span class="feat-icon">⚡</span>
            <div>
              <div class="feat-text">Akses Cepat</div>
              <div class="feat-sub">Personalisasi pengalaman nonton</div>
            </div>
          </div>
        </div>
      </div>`;

    if (hasGoogleId) switchMethod('email');
  }
}

function triggerGoogleLogin() {
  if (!GOOGLE_CLIENT_ID) { showToast('Google Login belum dikonfigurasi', 'error'); return; }
  google.accounts.id.prompt();
}

function doLogout() {
  if (!confirm('Yakin mau keluar?')) return;
  saveLocal('user', null);
  renderPage();
}

document.addEventListener('DOMContentLoaded', renderPage);
</script>
</body>
</html>
