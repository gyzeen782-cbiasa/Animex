<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nonton — AnimeKu</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body { background: #050508; }

    .watch-layout {
      padding-top: var(--nav-height);
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 0;
      min-height: 100vh;
    }

    /* ── Player Area ── */
    .player-area {
      background: #000;
      position: sticky;
      top: var(--nav-height);
      height: calc(100vh - var(--nav-height));
      display: flex;
      flex-direction: column;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      background: #000;
    }

    .player-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
    }

    .player-placeholder svg {
      opacity: 0.4;
    }

    .player-placeholder p {
      font-size: 13px;
    }

    .player-info {
      padding: 14px 20px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .player-anime-title {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-ep-info {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-nav-btns {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-ep-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-ep-nav:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-ep-nav:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* Server selector */
    .server-select {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .server-btn {
      padding: 5px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .server-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Sidebar Episode List ── */
    .sidebar {
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      height: calc(100vh - var(--nav-height));
      position: sticky;
      top: var(--nav-height);
    }

    .sidebar-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg-secondary);
      z-index: 1;
    }

    .sidebar-anime {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      text-decoration: none;
      color: inherit;
    }

    .sidebar-thumb {
      width: 44px;
      height: 60px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--bg-card);
    }

    .sidebar-title {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .sidebar-ep-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .ep-search {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
    }

    .ep-search:focus {
      border-color: var(--accent);
    }

    .sidebar-ep-list {
      padding: 8px;
    }

    .sidebar-ep-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      color: inherit;
    }

    .sidebar-ep-item:hover {
      background: var(--bg-card);
    }

    .sidebar-ep-item.active-ep {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
    }

    .sidebar-ep-item.active-ep .sidebar-ep-num {
      color: var(--accent);
    }

    .sidebar-ep-num {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      min-width: 28px;
      color: var(--text-muted);
    }

    .sidebar-ep-title {
      font-size: 13px;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-ep-watched {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      flex-shrink: 0;
    }

    .sidebar-ep-watched.done {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* ── Mobile layout ── */
    @media (max-width: 768px) {
      .watch-layout {
        grid-template-columns: 1fr;
      }

      .player-area {
        position: relative;
        height: auto;
      }

      .player-wrapper {
        aspect-ratio: 16/9;
        flex: none;
      }

      .sidebar {
        height: auto;
        position: relative;
        max-height: 400px;
        border-left: none;
        border-top: 1px solid var(--border);
      }

      .watch-layout {
        padding-bottom: 60px;
      }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="#" onclick="history.back()" style="background:none;border:none;cursor:pointer;color:var(--text-primary);display:flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;text-decoration:none;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Kembali
  </a>
  <a href="index.html" class="navbar-logo" style="position:absolute;left:50%;transform:translateX(-50%);">
    Anime<span>Ku</span>
  </a>
</nav>

<div class="watch-layout">

  <!-- ===== PLAYER ===== -->
  <div class="player-area">
    <div class="player-wrapper" id="playerWrapper">
      <div class="player-placeholder">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/>
        </svg>
        <p>Memuat player...</p>
      </div>
    </div>

    <div class="player-info">
      <div class="player-anime-title" id="playerTitle">Memuat...</div>
      <div class="player-ep-info">
        <span id="playerEpInfo">Episode —</span>
      </div>

      <!-- Server selector -->
      <div class="server-select" id="serverSelect">
        <!-- Diisi JS -->
      </div>

      <!-- Nav buttons -->
      <div class="player-nav-btns">
        <a href="#" class="btn-ep-nav" id="prevEpBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
          Ep Sebelumnya
        </a>
        <a href="#" class="btn-ep-nav" id="nextEpBtn">
          Ep Selanjutnya
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </a>
      </div>
    </div>
  </div>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="#" id="sidebarAnimeLink" class="sidebar-anime">
        <img id="sidebarThumb" class="sidebar-thumb" src="" alt="">
        <div>
          <div class="sidebar-title" id="sidebarTitle">Memuat...</div>
          <div class="sidebar-ep-label" id="sidebarEpLabel">— Episode</div>
        </div>
      </a>
      <input class="ep-search" type="number" placeholder="Cari episode..." id="epSearch" min="1"/>
    </div>
    <div class="sidebar-ep-list" id="sidebarEpList">
      <p style="color:var(--text-muted);font-size:13px;padding:8px">Memuat episode...</p>
    </div>
  </aside>

</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/main.js"></script>
<script src="js/watch.js"></script>
</body>
</html>
